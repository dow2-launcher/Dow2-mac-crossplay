name: build
# Builds crossplay_fix.dylib and the player zip from src/ (src/build_ci.sh) on a macOS runner with clang 19.
# Every push / PR: workflow artifact. Push to main: build provenance attestation + pre-release "mac-crossplay-<ver>"
# in this repository (assets replaced on rebuild). Nothing is uploaded anywhere else; no secrets are used.
on:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["src/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: ver
        run: echo "ver=$(cat src/VERSION)" >> "$GITHUB_OUTPUT"
      - name: clang 19 (same as the osxcross build)
        run: brew install llvm@19
      - name: Build
        env:
          CC: /opt/homebrew/opt/llvm@19/bin/clang
        run: src/build_ci.sh
      - name: Check
        run: |
          d=src/out/crossplay_fix.dylib
          file "$d"; otool -l "$d" | grep -A3 LC_BUILD_VERSION -m1 || otool -l "$d" | grep -A3 LC_VERSION_MIN -m1
          nm -gU "$d" | head -5
          unzip -l src/out/*.zip
          { echo "### crossplay_fix ${{ steps.ver.outputs.ver }}"; echo '```'; cat src/out/SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # check a download with: gh attestation verify <file> -R dow2-launcher/Dow2-mac-crossplay
      - name: Build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            src/out/*.zip
            src/out/crossplay_fix.dylib
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dow2mac_crossplay_${{ steps.ver.outputs.ver }}
          path: |
            src/out/*.zip
            src/out/crossplay_fix.dylib
            src/out/SHA256SUMS.txt
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VER: ${{ needs.build.outputs.ver }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dow2mac_crossplay_${{ needs.build.outputs.ver }}
          path: dist
      - name: GitHub Release
        run: |
          TAG="mac-crossplay-$VER"
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/crossplay_fix.dylib dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.zip dist/crossplay_fix.dylib dist/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease \
              --title "Mac crossplay $VER (test build)" \
              --notes "DoW2 Retribution: native Mac (Feral) <-> Windows crossplay patch, $VER. Test build. Built from src/ by this workflow; verify with: gh attestation verify <file> -R $GH_REPO. Install: README_RU.txt in the zip."
          fi
