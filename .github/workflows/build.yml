name: build
# Builds crossplay_fix.dylib and the player zip from src/ (src/build.sh) on a macOS runner with clang 19.
# Every push / PR: workflow artifact. Push to main: build provenance attestation + release "mac-crossplay-<ver>" (src/VERSION)
# in this repository (assets replaced on rebuild). Nothing is uploaded anywhere else; no secrets are used.
on:
  push:
    branches: [main]
    paths: ["src/**", "README.md", "LICENSE", ".github/workflows/build.yml"]
  pull_request:
    paths: ["src/**", "README.md", "LICENSE", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: ver
        run: echo "ver=$(cat src/VERSION)" >> "$GITHUB_OUTPUT"
      - name: clang 19 (same as the osxcross build)
        run: brew install llvm@19
      - name: Build
        env:
          CC: /opt/homebrew/opt/llvm@19/bin/clang
        run: src/build.sh
      - name: Check
        run: |
          d=src/out/crossplay_fix.dylib
          if nm "$d" | grep -Ei "rngtrace|crctrace|rng_stub"; then echo "diagnostics in the release build"; exit 1; fi
          if strings "$d" | grep -Ei "elite|dow2_net|dow2_rng|dow2_crc"; then echo "Elite or diagnostics strings in the dylib"; exit 1; fi
          if unzip -Z1 src/out/*.zip | grep -Eiv '^dow2mac/(crossplay_fix\.dylib|run_vanilla\.command|README\.txt|LICENSE\.txt)?$'; then echo "unexpected files in the zip"; exit 1; fi
          if grep -Ei "elite|curl|wget|https?://" src/out/dow2mac/run_vanilla.command; then echo "Elite or download logic in the run script"; exit 1; fi
          file "$d"; otool -l "$d" | grep -A3 LC_BUILD_VERSION -m1 || otool -l "$d" | grep -A3 LC_VERSION_MIN -m1
          nm -gU "$d" | head -5
          unzip -l src/out/*.zip
          { echo "### crossplay_fix ${{ steps.ver.outputs.ver }}"; echo '```'; cat src/out/SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # check a download with: gh attestation verify <file> -R dow2-launcher/Dow2-mac-crossplay
      - name: Build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            src/out/*.zip
            src/out/crossplay_fix.dylib
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dow2mac_crossplay_${{ steps.ver.outputs.ver }}
          path: |
            src/out/*.zip
            src/out/crossplay_fix.dylib
            src/out/SHA256SUMS.txt
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VER: ${{ needs.build.outputs.ver }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dow2mac_crossplay_${{ needs.build.outputs.ver }}
          path: dist
      - name: GitHub Release
        run: |
          TAG="mac-crossplay-$VER"
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            SUM=$(grep '\.zip$' dist/SHA256SUMS.txt | cut -d' ' -f1)
            gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" \
              --title "Mac crossplay $VER (vanilla)" \
              --notes "Dawn of War II: Retribution - the native Mac (Feral, Steam) version plays multiplayer with Windows players. Vanilla only (Elite is not supported yet), no launcher needed. Unzip, run run_vanilla.command; uninstall = delete the folder. Built from src/ at $GITHUB_SHA by this workflow. SHA-256 of the zip: $SUM. Verify: gh attestation verify <zip> -R $GH_REPO"
          fi
